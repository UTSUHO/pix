# Optional static compose file for manual debugging.
# The pix CLI does not use this file directly; it generates docker run
# commands from WSL using the shared pi runtime.
#
# This example mounts the WSL canonical pi runtime into the container at
# the same absolute path, so Direct and Sandbox modes share the same runtime.

services:
  pi:
    build:
      context: .
      dockerfile: Dockerfile
    image: pix-pi-sandbox
    stdin_open: true
    tty: true
    environment:
      - ANTHROPIC_API_KEY
      - ANTHROPIC_BASE_URL
      - OPENAI_API_KEY
      - OPENAI_BASE_URL
      - PI_CODING_AGENT_DIR=/home/${USER:-user}/.pix/runtime/agent
    volumes:
      - ${PWD:-.}:/workspace
      - /home/${USER:-user}/.pix/runtime:/home/${USER:-user}/.pix/runtime
    working_dir: /workspace
    entrypoint: ["pi"]
